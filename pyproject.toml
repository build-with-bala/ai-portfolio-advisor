[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-portfolio-advisor"
version = "0.1.0"
description = "Profile-aware portfolio recommendations from technical and fundamental evidence"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "lightgbm>=4.5,<5",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
  "shap>=0.46,<1",
  "statsmodels>=0.14,<1",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
  "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
